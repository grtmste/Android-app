# Local test stack for the Modafie theme: WordPress (PHP 8.2) + MariaDB + WP-CLI.
#   docker compose -f tools/test/docker-compose.yml up -d
#   site: http://localhost:8080  admin: admin / admin
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes: [db:/var/lib/mysql]
  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', false );
        define( 'WP_HTTP_BLOCK_EXTERNAL', getenv( 'MF_BLOCK_EXTERNAL' ) !== '0' );
        define( 'FS_METHOD', 'direct' );
    volumes: [wp:/var/www/html]
  cli:
    image: wordpress:cli-php8.2
    depends_on: [wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes: [wp:/var/www/html]
    entrypoint: ["sleep", "infinity"]
volumes:
  db:
  wp:
